plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.chaquo.python")
}

// Секреты для предзаполнения в APK берём из android/local.properties
// (файл в .gitignore, на GitHub не уходит). Ключей нет — поля пустые.
val localProps = java.util.Properties()
val localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.inputStream().use { localProps.load(it) }
}
val jarvisTgToken: String = localProps.getProperty("jarvis.telegram.token", "")
val jarvisGeminiKey: String = localProps.getProperty("jarvis.gemini.key", "")

android {
    namespace = "com.jarvis.bot"
    compileSdk = 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.jarvis.bot"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        // Дефолтные ключи вшиваются в APK только со сборочной машины
        buildConfigField("String", "TELEGRAM_TOKEN_DEFAULT", "\"$jarvisTgToken\"")
        buildConfigField("String", "GEMINI_KEY_DEFAULT", "\"$jarvisGeminiKey\"")

        ndk {
            // Narzo 50 (Helio G96) = arm64. Только arm64-v8a чтобы APK был меньше.
            abiFilters += listOf("arm64-v8a")
        }

        python {
            version = "3.11"
            pip {
                // Только чистый Python: нативные/Rust-пакеты Chaquopy под Android
                // собирает плохо. AI ходы идут через httpx, поиск — напрямую.
                install("python-telegram-bot[job-queue]==21.10")
                install("python-dotenv==1.1.0")
                install("httpx==0.27.0")
                install("pydub==0.25.1")
                install("SpeechRecognition==3.11.0")
                install("yt-dlp")
            }
        }
    }

    buildTypes {
        release {
            isMinifyEnabled = false
        }
        debug {
            isMinifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    // Без mobile-ffmpeg: это библиотека, а pydub/yt-dlp нужен ffmpeg-БИНАРНИК.
    // Бинарник (arm64 static) кладётся в filesDir/ffmpeg, bot_main.py сам подхватит.
    // Нет бинарника — чат работает полностью, музыка/голосовые отвечают заглушкой.
}

chaquopy {
    // python код лежит в app/src/main/python/
}

// Всегда брать свежий main.py из корня репо, чтобы APK и сервер не расходились
tasks.register<Copy>("syncBotMain") {
    from(rootProject.projectDir.parent + "/main.py")
    into("src/main/python")
}
tasks.named("preBuild") { dependsOn("syncBotMain") }
